      <circle cx="-30" cy="-46" r="13"/><circle cx="-30" cy="46" r="13"/>
      <circle cx="92" cy="-46" r="13"/><circle cx="92" cy="46" r="13"/>
    </g>
    <g stroke="#8b949e" stroke-width="1.2" fill="#8b949e" font-size="13">
