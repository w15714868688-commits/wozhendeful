        <line x1="-38" y1="0" x2="-58" y2="0"/><line x1="38" y1="0" x2="58" y2="0"/>
        <line x1="-38" y1="45" x2="-54" y2="20"/><line x1="38" y1="45" x2="54" y2="20"/>
      </g>
    </g>
    <g fill="#0b0f14" stroke="#8b949e" stroke-width="1.5">
