    <rect x="-22" y="-58" width="44" height="86" rx="18" fill="#39d5c8" fill-opacity=".16" stroke="#39d5c8" stroke-width="1.5"/>
    <line x1="0" y1="-82" x2="0" y2="-96" stroke="#f4f0e8" stroke-width="2"/>
    <g stroke="#8b949e" stroke-width="1.2" fill="#8b949e" font-size="13">
      <line x1="-180" y1="-200" x2="-180" y2="200" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <line x1="-186" y1="220" x2="186" y2="220" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <text x="0" y="244" text-anchor="middle">6.340 m</text>
