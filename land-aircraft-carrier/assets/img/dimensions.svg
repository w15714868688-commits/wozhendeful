  <text x="60" y="72" fill="#8b949e" font-size="12">6 轴 6 桨 · 双涵道 · 定距桨</text>
  <text x="470" y="46" fill="#f4f0e8" font-size="17" letter-spacing="2">B / 折叠 FOLDED</text>
  <text x="470" y="72" fill="#8b949e" font-size="12">机臂、桨叶、橇式起落架收拢</text>
  <text x="840" y="46" fill="#f4f0e8" font-size="17" letter-spacing="2">C / 收纳 STOWED</text>
  <text x="840" y="72" fill="#8b949e" font-size="12">陆行体后舱 · 5.5 m 车长</text>

  <g transform="translate(245 330)">
    <g stroke="#f4f0e8" stroke-width="7" stroke-linecap="round">
