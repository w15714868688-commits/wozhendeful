<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">X3-F 展开与折叠尺寸对比</title>
<desc id="desc">X3-F 展开时 6.834 米长、6.340 米宽，折叠后 2.934 米长、1.777 米宽，可放入 5.5 米长的陆行体后舱。</desc>
<defs>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M20 0H0V20" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
  </pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#8b949e"/>
  </marker>
</defs>
<rect width="1200" height="620" fill="#0b0f14"/>
<rect width="1200" height="620" fill="url(#grid)"/>
<g font-family="Microsoft YaHei, PingFang SC, sans-serif">
