<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">分体式架构的 A→A 闭环与 A→B 单程问题</title>
<desc id="desc">左图显示飞行体从营地起飞并回到原点；右图显示单程出行时，飞行体到达 B 点后必须返回 A 点取车，否则陆行体需要他人代驾。</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#39d5c8"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5a1f"/></marker>
</defs>
<rect width="1000" height="430" fill="#0b0f14"/>
<g font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <line x1="500" y1="40" x2="500" y2="390" stroke="#ffffff" stroke-opacity=".12"/>
  <text x="60" y="58" fill="#f4f0e8" font-size="18" letter-spacing="1">A → A / 营地闭环</text>
  <text x="60" y="82" fill="#39d5c8" font-size="12">当前 X3-F 最匹配的运营形态</text>
  <path d="M250 300 C130 300 130 135 250 135 C370 135 370 300 250 300" fill="none" stroke="#39d5c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/>
  <g transform="translate(250 300)">
    <rect x="-44" y="-16" width="88" height="32" rx="10" fill="#151a1f" stroke="#f4f0e8" stroke-width="2"/>
    <circle cx="-28" cy="18" r="8" fill="#0b0f14" stroke="#8b949e"/><circle cx="28" cy="18" r="8" fill="#0b0f14" stroke="#8b949e"/>
    <text x="0" y="5" text-anchor="middle" fill="#f4f0e8" font-size="11">陆行体 / 营地</text>
  </g>
  <g transform="translate(250 135)">
    <g transform="scale(.9)">
      <line x1="-30" y1="0" x2="-8" y2="0" stroke="#39d5c8" stroke-width="4"/><line x1="8" y1="0" x2="30" y2="0" stroke="#39d5c8" stroke-width="4"/>
      <line x1="-22" y1="-10" x2="-22" y2="10" stroke="#39d5c8" stroke-width="2"/><line x1="22" y1="-10" x2="22" y2="10" stroke="#39d5c8" stroke-width="2"/>
      <rect x="-12" y="-16" width="24" height="32" rx="8" fill="#151a1f" stroke="#39d5c8" stroke-width="2"/>
    </g>
  </g>
  <text x="250" y="200" text-anchor="middle" fill="#f4f0e8" font-size="13">20 km / 20 min</text>
  <text x="250" y="220" text-anchor="middle" fill="#8b949e" font-size="11">起飞、绕飞、回到同一营地</text>
  <text x="250" y="365" text-anchor="middle" fill="#39d5c8" font-size="12">✓ 飞行体与陆行体始终在同一地点</text>

  <text x="560" y="58" fill="#f4f0e8" font-size="18" letter-spacing="1">A → B / 单程出行</text>
  <text x="560" y="82" fill="#ff5a1f" font-size="12">分体式架构的“最后一公里”反噬</text>
  <g transform="translate(600 310)">
    <rect x="-44" y="-16" width="88" height="32" rx="10" fill="#151a1f" stroke="#f4f0e8" stroke-width="2"/>
    <circle cx="-28" cy="18" r="8" fill="#0b0f14" stroke="#8b949e"/><circle cx="28" cy="18" r="8" fill="#0b0f14" stroke="#8b949e"/>
    <text x="0" y="5" text-anchor="middle" fill="#f4f0e8" font-size="11">A / 家</text>
  </g>
  <g transform="translate(870 150)">
    <rect x="-44" y="-16" width="88" height="32" rx="10" fill="#151a1f" stroke="#f4f0e8" stroke-width="2"/>
    <circle cx="-28" cy="18" r="8" fill="#0b0f14" stroke="#8b949e"/><circle cx="28" cy="18" r="8" fill="#0b0f14" stroke="#8b949e"/>
    <text x="0" y="5" text-anchor="middle" fill="#f4f0e8" font-size="11">B / 目的地</text>
  </g>
  <path d="M600 280 C650 190 780 150 830 150" fill="none" stroke="#39d5c8" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M830 185 C790 290 690 345 645 330" fill="none" stroke="#ff5a1f" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#b)"/>
  <text x="700" y="215" fill="#ff5a1f" font-size="12">必须返回 A 取车</text>
  <text x="560" y="370" fill="#8b949e" font-size="12">或者：让另一个人把陆行体开到 B——</text>
  <text x="560" y="390" fill="#ff5a1f" font-size="12">这就不是“飞行汽车”，而是“飞机 + 代驾”。</text>
</g>
</svg>